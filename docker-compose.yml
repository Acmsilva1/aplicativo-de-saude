services:
  ritmo-saude:
    build: .
    image: ritmo-saude:latest
    container_name: ritmo-saude
    restart: unless-stopped
    ports:
      - "127.0.0.1:5199:5199"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5199"
      COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: "1"
    mem_limit: 384m
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5199/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
